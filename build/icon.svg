<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Nixi app icon. Source for build/icon.{icns,ico,png}: node scripts/make-icon.mjs -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3150"/>
      <stop offset="1" stop-color="#0e1222"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff0ff"/>
      <stop offset="1" stop-color="#4f7dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824 px body, 100 px margin -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- three window dots: a terminal window -->
  <g fill="#ffffff" fill-opacity="0.16">
    <circle cx="214" cy="210" r="20"/>
    <circle cx="276" cy="210" r="20"/>
    <circle cx="338" cy="210" r="20"/>
  </g>

  <!-- prompt: chevron + cursor, with a soft glow behind -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M300 372 L470 512 L300 652" fill="none" stroke="#4f8cff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="540" y="606" width="200" height="72" rx="36" fill="#4f8cff"/>
  </g>
  <path d="M300 372 L470 512 L300 652" fill="none" stroke="url(#glyph)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="540" y="610" width="200" height="66" rx="33" fill="url(#glyph)"/>
</svg>
